<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notcorporate.co | Social Media Agency</title>
  <meta
    name="description"
    content="notcorporate.co is a social media agency with a bold, simple landing page built around attention, views, and direct contact."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css?v=20260323a">
</head>
<body>
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>

  <main id="home" class="hero-layout">
    <section class="intro-copy">
      <h1 id="introHeading" aria-label="attention is currency"></h1>
    </section>

    <section class="phone-stage" aria-label="Phone preview">
      <div class="phone-backdrop"></div>
      <div class="phone-drift" id="phoneDrift">
        <div class="phone-shell">
          <div class="frame-sheen"></div>
          <div class="frame-rim"></div>
          <div class="side-button side-button-top"></div>
          <div class="side-button side-button-mid"></div>
          <div class="side-button side-button-low"></div>
          <div class="side-button-right"></div>

          <div class="front-glass">
            <div class="dynamic-island">
              <span class="island-speaker"></span>
              <span class="island-sensor"></span>
            </div>

            <div class="screen">
              <div class="phone-video-shell">
                <video
                  class="phone-video"
                  id="phoneVideo"
                  playsinline
                  webkit-playsinline
                  preload="auto"
                  muted
                  loop
                >
                  <source src="media/creatives.mp4" type="video/mp4">
                  <source src="media/creatives.mov" type="video/quicktime">
                </video>
                <button class="play-button" type="button" id="nextStory" aria-label="Play video with sound" data-no-drag>
                  <span></span>
                </button>
                <button class="sound-toggle" type="button" id="soundToggle" aria-label="Enable sound" data-no-drag>
                  Sound on
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <section class="scroll-story" id="scrollStory" aria-label="Brand reveal">
    <div class="scroll-stage">
      <div class="scroll-copy">
        <p class="scroll-line" id="scrollLine">time for some f*cking views</p>
        <div class="scroll-lockup">
          <div class="scroll-brand" id="scrollBrand">
            <div class="scroll-brand-wordmark">
              <h2>not corporate</h2>
              <p class="scroll-brand-subline">
                <span>SOCIAL MEDIA</span>
                <span>AGENCY</span>
              </p>
            </div>
          </div>
          <a class="scroll-brand-link" href="mailto:contact@notcorporate.co">Get in touch</a>
        </div>
      </div>
    </div>
  </section>

  <script src="analytics-config.js?v=20260323a"></script>
  <script src="script.js?v=20260323a"></script>
</body>
</html>
