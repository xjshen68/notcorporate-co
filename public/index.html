<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notcorporate.co | Social Media Agency</title>
  <meta
    name="description"
    content="notcorporate.co is a social media agency with a bold, simple landing page built around attention, views, and direct contact."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>

  <main id="home" class="hero-layout">
    <section class="intro-copy">
      <h1>attention is currency</h1>
      <p class="intro-text">
        notcorporate.co builds social presence that feels sharp, fast, and impossible to ignore.
      </p>
      <div class="intro-actions">
        <a class="button button-solid" href="mailto:notcorporatecreative@gmail.com">Get in touch</a>
      </div>
    </section>

    <section class="phone-stage" aria-label="Phone preview">
      <div class="phone-backdrop"></div>
      <div class="phone-shell">
        <div class="frame-sheen"></div>
        <div class="frame-rim"></div>
        <div class="side-button side-button-top"></div>
        <div class="side-button side-button-mid"></div>
        <div class="side-button side-button-low"></div>
        <div class="side-button-right"></div>

        <div class="front-glass">
          <div class="dynamic-island">
            <span class="island-speaker"></span>
            <span class="island-sensor"></span>
          </div>

          <div class="screen">
            <div class="story-track" id="storyTrack">
              <section class="story-panel is-active">
                <p class="story-line">attention is currency</p>
                <button class="play-button" type="button" id="nextStory" aria-label="Play next screen">
                  <span></span>
                </button>
              </section>

              <section class="story-panel">
                <p class="story-line">time for some f*cking views.</p>
                <div class="wordmark-block">
                  <h2>not corporate</h2>
                </div>
              </section>

              <section class="story-panel">
                <p class="story-line">time for some f*cking views.</p>
                <div class="wordmark-block compact">
                  <h2>not corporate</h2>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
